services:
  dipay:
    build:
      context: .
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: ${PHPAY_PROXY:-}
        HTTPS_PROXY: ${PHPAY_PROXY:-}
    container_name: dipay
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      PORT: 3456
      HOST: 0.0.0.0
      HTTP_PROXY: ${PHPAY_PROXY:-}
      HTTPS_PROXY: ${PHPAY_PROXY:-}
      CF_PROXY: ${PHPAY_PROXY:-}
      PROXY_POOL: ${PROXY_POOL:-}
      BROWSER_WS_ENDPOINT: ${BROWSER_WS_ENDPOINT:-}
      CHROME_PATH: ${CHROME_PATH:-}
      SOLVER_API_KEY: ${SOLVER_API_KEY:-}
    volumes:
      - ./config:/app/config
      - ./accounts:/app/accounts
      - ./cards:/app/cards
      - ./addresses:/app/addresses
      - ./payment-tasks:/app/payment-tasks
      - ./out:/app/out
    restart: unless-stopped
